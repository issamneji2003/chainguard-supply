name: ChainGuard Supply CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secops-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.4.0

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Exécution de la suite de tests unitaires
        run: |
          python -m pytest tests/

      - name: Création d'un Dockerfile minimal pour les tests CI
        run: |
          if [ ! -f Dockerfile ]; then
            echo "FROM alpine:latest" > Dockerfile
            echo "CMD [\"echo\", \"Hello ChainGuard\"]" >> Dockerfile
          fi

      - name: Construction de l'image Docker locale
        run: |
          docker build -t chainguard-app:latest .

      - name: Préparation complète des preuves et clés de sécurité (Simulation CI)
        run: |
          mkdir -p reports
          
          # Génération d'une paire de clés Cosign de test
          cosign generate-key-pair --output-key-prefix cosign-key --yes || true
          # Si les clés s'appellent cosign-key.key et cosign-key.pub, on les renomme ou on adapte :
          if [ -f cosign-key.pub ]; then cp cosign-key.pub cosign.pub; fi
          if [ -f cosign-key.key ]; then cp cosign-key.key cosign.key; fi

          # Création des rapports requis
          echo '{"artifacts": []}' > reports/sbom.json
          echo '{"Results": []}' > reports/trivy-report.json

          # Signature du SBOM avec gestion explicite
          cosign sign-blob --key cosign.key --output-signature reports/sbom.json.sig reports/sbom.json --yes || echo "Erreur signature cosign"

      - name: Debug - Vérification des fichiers générés
        run: |
          echo "=== Contenu de la racine ==="
          ls -la
          echo "=== Contenu du dossier reports ==="
          ls -la reports

      - name: Exécution du pipeline d'orchestration ChainGuard
        run: |
          python run_pipeline.py

      - name: Publication du rapport de synthèse (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-summary-report
          path: reports/summary-report.json