name: ChainGuard Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 1. Application du principe du moindre privilège au niveau du job
permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Exécuter les tests unitaires
        run: PYTHONPATH=. python -m pytest tests/

      - name: Installer Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Installer Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Installer Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Créer le dossier reports
        run: mkdir -p reports

      - name: Build de l'image Docker sécurisée
        run: docker build -t chainguard-app:latest .

      - name: Générer le SBOM depuis l'image Docker via Trivy
        run: |
          trivy image --format cyclonedx -o reports/sbom.json chainguard-app:latest

      - name: Scanner les vulnérabilités via Trivy
        run: |
          trivy image --format json -o reports/trivy-report.json chainguard-app:latest

      - name: Lancer le pipeline de sécurité (Quality Gates)
        run: python run_pipeline.py

      - name: Générer une paire de clés Cosign (mode test)
        run: |
          cosign generate-key-pair --output-key-prefix cosign --force
        env:
          COSIGN_PASSWORD: ""

      - name: Signer numériquement le SBOM généré
        run: |
          cosign sign-blob --key cosign.key reports/sbom.json --output-signature reports/sbom.json.sig --yes
        env:
          COSIGN_PASSWORD: ""

      - name: Vérifier la signature cryptographique du SBOM
        run: |
          cosign verify-blob --key cosign.pub --signature reports/sbom.json.sig reports/sbom.json

      - name: Sauvegarder les rapports de sécurité et signatures (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainguard-security-reports
          path: reports/