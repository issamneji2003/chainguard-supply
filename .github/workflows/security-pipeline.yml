name: ChainGuard Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Exécuter les tests unitaires
        run: PYTHONPATH=. python -m pytest tests/

      - name: Installer Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Installer Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Créer le dossier reports
        run: mkdir -p reports

      - name: Lancer le pipeline de sécurité
        run: python run_pipeline.py

      - name: Sauvegarder les rapports de sécurité (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainguard-security-reports
          path: reports/